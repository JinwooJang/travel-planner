# Publishes only index.html to GitHub Pages (src/, tools/ and data files are not served).
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy planner to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["index.html", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Make sure no API key slipped into the page
        run: "! grep -E 'AIza[0-9A-Za-z_-]{30,}' index.html"
      - name: Collect the site (the planner page only)
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
